name: Bug report
description: Report a reproducible problem in capimgr.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, search for an existing report. Do not include credentials,
        kubeconfigs, or sensitive cluster data. For security vulnerabilities, follow
        the repository's SECURITY.md instead of filing a public issue.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include sanitized error messages if relevant.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest steps that reproduce the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: capimgr version or commit
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Kubernetes, Cluster API, browser, and operating system versions, as relevant.
