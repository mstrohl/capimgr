server {
  listen 80;
  server_name localhost;

  # Racine des fichiers statiques
  root /usr/share/nginx/html;
  index index.html index.htm;

  # Configuration pour le routage de l'application (SPA)
  # Si un fichier ou un dossier n'est pas trouvé, renvoyer vers index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Note: Nous n'avons PAS besoin de 'location /api' ici.
  # L'Ingress Kubernetes s'occupera de ce routage avant
  # même que la requête n'atteigne ce serveur Nginx.
}
