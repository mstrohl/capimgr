# --- Backend Deployment (Go API) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: capi-backend-deployment
  # !! AJOUT: Déployer dans notre namespace
  namespace: capi-dashboard-system
spec:
  replicas: 1 # Commencer avec 1 pour le debug
  selector:
    matchLabels:
      app: capi-backend
  template:
    metadata:
      labels:
        app: capi-backend
    spec:
      # !! AJOUT: Utiliser notre Service Account
      serviceAccountName: capi-dashboard-sa
      containers:
      - name: backend
        # !! ATTENTION: Remplacez par le nom de VOTRE image !!
        image: smartdeploy/capimgr-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080 

---
# --- Backend Service ---
apiVersion: v1
kind: Service
metadata:
  name: capi-backend-service
  # !! AJOUT: Dans notre namespace
  namespace: capi-dashboard-system
spec:
  selector:
    app: capi-backend
  ports:
  - protocol: TCP
    port: 80 
    targetPort: 8080 

---
# --- Frontend Deployment (React + Nginx) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: capi-frontend-deployment
  # !! AJOUT: Déployer dans notre namespace
  namespace: capi-dashboard-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: capi-frontend
  template:
    metadata:
      labels:
        app: capi-frontend
    spec:
      containers:
      - name: frontend
        # !! ATTENTION: Remplacez par le nom de VOTRE image !!
        image: smartdeploy/capimgr-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80 

---
# --- Frontend Service ---
apiVersion: v1
kind: Service
metadata:
  name: capi-frontend-service
  # !! AJOUT: Dans notre namespace
  namespace: capi-dashboard-system
spec:
  selector:
    app: capi-frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80

---
# --- Ingress (Porte d'entrée) ---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: capi-ingress
  # !! AJOUT: Dans notre namespace
  namespace: capi-dashboard-system
  annotations:
    kubernetes.io/ingress.class: "nginx"
    # !! CORRIGÉ: Suppression du rewrite-target qui n'est pas nécessaire
    # avec les nouvelles règles de path.
spec:
  rules:
  - host: capi.k8s.dive-in-it.com
    http:
      paths:
      # Règle 1: Tout ce qui commence par /api/
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: capi-backend-service
            port:
              number: 80
      
      # Règle 2: Tout le reste (le frontend)
      # !! CORRIGÉ: Utilisation d'un path préfixe valide "/"
      - path: /
        pathType: Prefix
        backend:
          service:
            name: capi-frontend-service
            port:
              number: 80